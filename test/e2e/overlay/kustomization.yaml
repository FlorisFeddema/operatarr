apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../config/default
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: example.com/operatarr:e2e
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --job-runner-image=example.com/operatarr-jobrunner:e2e
