name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_TOOL: docker
      KIND_CLUSTER: operatarr-e2e
      KUBECONFIG: ${{ github.workspace }}/.kube/operatarr-e2e
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "**/go.sum"

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Create kind cluster
        run: make kind-create

      - name: Run e2e tests
        run: |
          set -o pipefail
          mkdir -p e2e-diagnostics
          make test-e2e 2>&1 | tee e2e-diagnostics/test-e2e.log

      - name: Export kind logs
        if: failure()
        run: kind export logs e2e-diagnostics/kind-logs --name "$KIND_CLUSTER"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore

      - name: Delete kind cluster
        if: always()
        run: make kind-delete
